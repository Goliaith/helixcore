[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helixcore"
version = "0.3.0"
description = "Local journal for agent sessions: a task note, a keyword log, and links between tasks. You bring the model."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MrSilhouette"}]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 7 - Inactive",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Goliaith/helixcore"
Documentation = "https://github.com/Goliaith/helixcore#readme"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"*" = ["**/*"]

[tool.setuptools]
include-package-data = true
